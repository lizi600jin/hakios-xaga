# devices/xaga/device.conf: the phone, for the common repository's device tooling (tools/hakios-device.py; the same
# words as x6826b's device.conf). Its SoC's layer is the common repository's mtk/mt6895/.
#
# Redmi Note 11T Pro, "xaga", MediaTek MT6895 (Dimensity 8100), 8 GB, UFS 3.1. Everything under `status` below is what
# has actually been run: the loader's facts are read out of this phone (work-xaga/dump/), and nothing of the kernel's
# has been on it yet, because there is no way to put a kernel on it without a disk to boot a user space from.
device xaga
	title	Redmi Note 11T Pro (XAGA)
	vendor	Xiaomi
	soc	mt6895
	defconfig	xaga_defconfig
	maintainer	the HakiOS developers (README.md)
	status cpu partial 4 of 8 cores offered to the kernel (cpus=4): core 0 (an A55), then the three A78s; no cpufreq, so they run at the speed LK left them (mt6895.config)
	status display partial LK's framebuffer handed over in boot_args and the loader's console on it (1080x2460); no GPU driver (the G610 is not the G52 the MT6768 driver is written for), so software drawing only
	status storage missing no UFS in the loader and no kernel driver that can own the controller from reset, so no system image and no disk: the root is the ramdisk the payload carries (mt6895.config says why)
	status touch missing a Novatek controller (NVTCapacitiveTouchScreen in the kernel's input driver); the MT6768's TD4160 bring-up is left off, its clock-gate offsets are not this SoC's (board.h: BOARD_TOUCH 0)
	status buttons missing the keypad is at 0x1c00e000 over the MT6363 PMIC on SPMI; mt6768's MTK_KEYS reads 0x10010000 and the PMIC directly
	status gpu missing Mali-G610 (Valhall) at 0x13000000; mtk/mt6768's MALI driver is written for the G52 MC2
	status wifi missing CONNSYS of a later generation than the MT6768's
	status bluetooth missing same CONNSYS as Wi-Fi; HCI over STP not written
	status cellular missing
	status audio missing
	status battery missing
	status haptic missing
	status camera missing
	status torch missing
	status thermal missing
	status sensors missing
	status usb missing
